name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium for dashboard UI checks
        run: npx playwright-core install --with-deps chromium

      - name: Verify application
        run: npm run check
        env:
          PJ_UI_FAILURE_SCREENSHOT: ${{ runner.temp }}/smoke-ui-failure.png

      # The dashboard suite only ever renders a synthetic profile.
      - name: Upload the dashboard screenshot from a failed UI check
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-ui-failure
          path: ${{ runner.temp }}/smoke-ui-failure.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
